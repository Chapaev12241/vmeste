name: Build IPA
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ryadom-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build installable app
        run: xcodebuild -project Ryadom.xcodeproj -scheme Ryadom -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for AltStore
        run: |
          codesign --force --sign - --entitlements Widget.entitlements build/Build/Products/Release-iphoneos/Ryadom.app/PlugIns/RyadomWidget.appex
          codesign --force --sign - --entitlements Ryadom.entitlements build/Build/Products/Release-iphoneos/Ryadom.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ryadom.app Payload/
          zip -qr Ryadom-0.4-AltStore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ryadom-0.4-AltStore
          path: Ryadom-0.4-AltStore.ipa
