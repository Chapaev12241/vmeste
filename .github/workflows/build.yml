name: Build Ryadom
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s server -v
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Ryadom.xcodeproj -scheme Ryadom -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Embed entitlements for AltStore resigning
        run: |
          codesign --force --sign - --entitlements Widget.entitlements build/Build/Products/Release-iphoneos/Ryadom.app/PlugIns/RyadomWidget.appex
          codesign --force --sign - --entitlements Ryadom.entitlements build/Build/Products/Release-iphoneos/Ryadom.app
          test -f "build/Build/Products/Release-iphoneos/Ryadom.app/Docker One.ttf"
      - run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Ryadom.app Payload/ && zip -qr Ryadom-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ryadom-unsigned
          path: Ryadom-unsigned.ipa
      - name: Capture iPhone preview
        continue-on-error: true
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project Ryadom.xcodeproj -scheme Ryadom -sdk iphonesimulator -configuration Debug -destination "id=$DEVICE" -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
          xcrun simctl install "$DEVICE" simulator-build/Build/Products/Debug-iphonesimulator/Ryadom.app
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl launch "$DEVICE" com.personal.ryadom
          sleep 20
          xcrun simctl io "$DEVICE" screenshot Ryadom-iPhone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ryadom-preview
          path: |
            Ryadom-iPhone.png
            simulator-build.log
