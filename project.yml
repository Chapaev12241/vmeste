name: Ryadom
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2'
    CURRENT_PROJECT_VERSION: '2'
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    exactVersion: 6.31.0
targets:
  Ryadom:
    type: application
    platform: iOS
    sources:
      - RyadomApp.swift
      - API.swift
      - CityMap.swift
      - Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - target: RyadomWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ryadom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Ryadom.entitlements
      properties:
        com.apple.security.application-groups: [group.com.personal.ryadom]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleDisplayName: Рядом
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSLocationWhenInUseUsageDescription: Показывать и отправлять твою позицию партнёру с твоего разрешения.
        NSLocationAlwaysAndWhenInUseUsageDescription: Обновлять позицию для партнёра при перемещении в фоне.
        UIAppFonts: [Docker One.ttf]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ryadom]
  RyadomWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ryadom.widget
    entitlements:
      path: Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.personal.ryadom]
    info:
      path: Widget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Ryadom:
    build:
      targets:
        Ryadom: all
